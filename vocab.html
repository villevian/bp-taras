const KEYL="BP B1 Vocabulary",CODE="700fd454c53e57244dd017cc008b8654";let ITEMS=[{"id": "1.1|transferable skills", "l": "1.1", "g": "Transferable skills", "en": "transferable skills", "uk": "навички, що переносяться (з роботи в роботу)", "df": "skills you can use in many different jobs and roles", "ex": "Critical thinking is one of the most valuable transferable skills."}, {"id": "1.1|think outside the box", "l": "1.1", "g": "Transferable skills", "en": "think outside the box", "uk": "мислити нестандартно", "df": "have new, creative ideas", "ex": "She thought outside the box and replaced the spec with a demo video."}, {"id": "1.1|a can-do attitude", "l": "1.1", "g": "Transferable skills", "en": "a can-do attitude", "uk": "позитивний настрій «я зможу»", "df": "being positive and ready to try difficult things", "ex": "He took the old project with a real can-do attitude."}, {"id": "1.1|set goals", "l": "1.1", "g": "Transferable skills", "en": "set goals", "uk": "ставити цілі", "df": "decide what you want to achieve", "ex": "I set goals for every sprint."}, {"id": "1.1|critical thinking", "l": "1.1", "g": "Transferable skills", "en": "critical thinking", "uk": "критичне мислення", "df": "checking information carefully before you accept it", "ex": "Use critical thinking when AI suggests a solution."}, {"id": "1.1|determination", "l": "1.1", "g": "Transferable skills", "en": "determination", "uk": "рішучість, наполегливість", "df": "not giving up when something is difficult", "ex": "It took determination to pass the interview on the third try."}, {"id": "1.1|team player", "l": "1.1", "g": "Transferable skills", "en": "team player", "uk": "командний гравець", "df": "someone who works well with others", "ex": "Nobody ships a product alone – be a team player."}, {"id": "1.1|integrity", "l": "1.1", "g": "Transferable skills", "en": "integrity", "uk": "чесність, порядність", "df": "being honest and doing what is right", "ex": "If you broke the build, say so – that’s integrity."}, {"id": "1.1|communication skills", "l": "1.1", "g": "Transferable skills", "en": "communication skills", "uk": "комунікативні навички", "df": "the ability to explain things and listen well", "ex": "Communication skills are tested every day in a distributed team."}, {"id": "1.1|problem-solving", "l": "1.1", "g": "Transferable skills", "en": "problem-solving", "uk": "вирішення проблем", "df": "finding solutions to difficult situations", "ex": "AI suggests ten solutions; problem-solving is choosing the right one."}, {"id": "1.1|adaptable – adaptability", "l": "1.1", "g": "Adjective → noun", "en": "adaptable – adaptability", "uk": "здатний пристосовуватися – адаптивність", "df": "able to change when the situation changes", "ex": "You need to be adaptable – our priorities change every sprint."}, {"id": "1.1|flexible – flexibility", "l": "1.1", "g": "Adjective → noun", "en": "flexible – flexibility", "uk": "гнучкий – гнучкість", "df": "able to change plans or ways of working easily", "ex": "Flexibility matters – our tech stack changes every year."}, {"id": "1.1|motivated – motivation", "l": "1.1", "g": "Adjective → noun", "en": "motivated – motivation", "uk": "вмотивований – мотивація", "df": "wanting to do something well", "ex": "We’re looking for a motivated engineer."}, {"id": "1.1|confident – confidence", "l": "1.1", "g": "Adjective → noun", "en": "confident – confidence", "uk": "впевнений – впевненість", "df": "sure about your abilities", "ex": "He speaks with more confidence in meetings now."}, {"id": "1.1|dependable – dependability", "l": "1.1", "g": "Adjective → noun", "en": "dependable – dependability", "uk": "надійний – надійність", "df": "someone you can trust to do what they promise", "ex": "Our team lead is very dependable."}, {"id": "1.1|resourceful – resourcefulness", "l": "1.1", "g": "Adjective → noun", "en": "resourceful – resourcefulness", "uk": "винахідливий – винахідливість", "df": "good at finding ways to solve problems", "ex": "She’s resourceful: she always finds a workaround."}, {"id": "1.1|independent – independence", "l": "1.1", "g": "Adjective → noun", "en": "independent – independence", "uk": "самостійний – самостійність", "df": "able to work without help", "ex": "We need an independent engineer who can work without a manager."}, {"id": "1.1|ambitious – ambition", "l": "1.1", "g": "Adjective → noun", "en": "ambitious – ambition", "uk": "амбітний – амбіція", "df": "wanting to be successful", "ex": "His ambition is to become a tech lead."}, {"id": "1.1|passionate – passion", "l": "1.1", "g": "Adjective → noun", "en": "passionate – passion", "uk": "пристрасний, захоплений – пристрасть", "df": "loving what you do", "ex": "Her passion for clean code is visible in every PR."}, {"id": "1.1|enthusiastic – enthusiasm", "l": "1.1", "g": "Adjective → noun", "en": "enthusiastic – enthusiasm", "uk": "захоплений – ентузіазм", "df": "showing a lot of interest and energy", "ex": "The new junior shows a lot of enthusiasm."}, {"id": "1.1|honest – honesty", "l": "1.1", "g": "Adjective → noun", "en": "honest – honesty", "uk": "чесний – чесність", "df": "telling the truth", "ex": "Be honest in your profile."}, {"id": "1.1|authentic – authenticity", "l": "1.1", "g": "Adjective → noun", "en": "authentic – authenticity", "uk": "справжній – автентичність", "df": "real, not pretending", "ex": "Employers value authenticity in interviews."}, {"id": "1.1|inflexible / unmotivated / dishonest", "l": "1.1", "g": "Adjective → noun", "en": "inflexible / unmotivated / dishonest", "uk": "негнучкий / невмотивований / нечесний", "df": "negative adjectives with in-, un-, dis-", "ex": "Nobody wants an inflexible, dishonest colleague."}, {"id": "1.1|unreliable / disorganised", "l": "1.1", "g": "Adjective → noun", "en": "unreliable / disorganised", "uk": "ненадійний / неорганізований", "df": "negative adjectives with un-, dis-", "ex": "An unreliable contractor loses clients fast."}, {"id": "1.1|a tough job market", "l": "1.1", "g": "From the video", "en": "a tough job market", "uk": "складний ринок праці", "df": "a time when it is hard to find a job", "ex": "Even in a tough job market, your experience is valuable."}, {"id": "1.1|previous experience", "l": "1.1", "g": "From the video", "en": "previous experience", "uk": "попередній досвід", "df": "the jobs and projects you did before", "ex": "Look at your previous experience for transferable skills."}, {"id": "1.1|conflict resolution", "l": "1.1", "g": "From the video", "en": "conflict resolution", "uk": "вирішення конфліктів", "df": "helping people agree when there is a problem between them", "ex": "Conflict resolution is important in every team."}, {"id": "1.1|the AI boom", "l": "1.1", "g": "From the video", "en": "the AI boom", "uk": "бум штучного інтелекту", "df": "the time when AI is growing very fast", "ex": "Soft skills matter even more during the AI boom."}, {"id": "1.1|audit your skills", "l": "1.1", "g": "From the video", "en": "audit your skills", "uk": "проаналізувати (провести аудит) свої навички", "df": "check carefully what skills you have", "ex": "Start your career change by auditing your skills."}, {"id": "1.1|change careers", "l": "1.1", "g": "From the video", "en": "change careers", "uk": "змінити професію / кар’єру", "df": "start working in a different field", "ex": "Many people change careers in their thirties."}, {"id": "1.1|fit into the team", "l": "1.1", "g": "From the video", "en": "fit into the team", "uk": "вписатися в команду", "df": "work well and feel comfortable with the other people in a team", "ex": "Employers ask: can this candidate fit into the team well?"}, {"id": "1.1|influence people", "l": "1.1", "g": "From the video", "en": "influence people", "uk": "впливати на людей", "df": "change what other people think or do", "ex": "The ability to influence people is an important skill."}, {"id": "1.1|internship", "l": "1.1", "g": "From the video", "en": "internship", "uk": "стажування", "df": "a short period of work to get experience, often for students", "ex": "She did a three-month internship at a software company."}, {"id": "1.1|part-time job", "l": "1.1", "g": "From the video", "en": "part-time job", "uk": "робота на неповний день", "df": "a job for only some hours of the day or week", "ex": "A part-time job shows that you can manage your time."}, {"id": "1.1|volunteer work", "l": "1.1", "g": "From the video", "en": "volunteer work", "uk": "волонтерська робота", "df": "work you do without pay to help people", "ex": "Volunteer work can show your communication skills."}, {"id": "1.1|the whole person behind the CV", "l": "1.1", "g": "From the video", "en": "the whole person behind the CV", "uk": "людина повністю, а не лише резюме", "df": "who you really are – skills, qualities and experience together", "ex": "Employers hire the whole person behind the CV."}, {"id": "1.1|project management", "l": "1.1", "g": "From the video", "en": "project management", "uk": "управління проєктами", "df": "planning and organising work so a project finishes on time", "ex": "IT work is almost always organised as projects."}, {"id": "1.1|stakeholder management", "l": "1.1", "g": "From the video", "en": "stakeholder management", "uk": "управління стейкхолдерами (зацікавленими сторонами)", "df": "understanding the people involved in a project and meeting their needs", "ex": "Stakeholder management means learning how each group communicates."}, {"id": "1.1|teamwork and collaboration", "l": "1.1", "g": "From the video", "en": "teamwork and collaboration", "uk": "командна робота і співпраця", "df": "working well together with other people and teams", "ex": "IT projects need teamwork and collaboration across departments."}, {"id": "1.1|plain business language", "l": "1.1", "g": "From the video", "en": "plain business language", "uk": "проста ділова мова (без жаргону)", "df": "simple words that non-technical people understand", "ex": "Explain the bug in plain business language."}, {"id": "1.1|technical vocabulary omething", "ex": "These costs are rarely covered by employers."}, {"id": "4.2|give up", "l": "4.2", "g": "From the article", "en": "give up", "uk": "відмовитися від", "df": "stop doing or having something", "ex": "I didn’t want to give up working from home."}, {"id": "4.2|tasks are assigned", "l": "4.2", "g": "Grammar: passive & have something done", "en": "tasks are assigned", "uk": "завдання призначаються", "df": "Present Simple passive: am/is/are + V3", "ex": "Tasks are assigned in Jira."}, {"id": "4.2|the deadline was moved", "l": "4.2", "g": "Grammar: passive & have something done", "en": "the deadline was moved", "uk": "дедлайн перенесли", "df": "Past Simple passive: was/were + V3", "ex": "The deadline was moved last week."}, {"id": "4.2|have something done", "l": "4.2", "g": "Grammar: passive & have something done", "en": "have something done", "uk": "доручити щось зробити (комусь)", "df": "someone else does the job for you", "ex": "I had my laptop repaired last week."}, {"id": "4.2|have my CV checked", "l": "4.2", "g": "Grammar: passive & have something done", "en": "have my CV checked", "uk": "дати перевірити своє CV", "df": "ask a professional to check your CV", "ex": "I had my CV checked by a recruiter."}, {"id": "4.2|have the website redesigned", "l": "4.2", "g": "Grammar: passive & have something done", "en": "have the website redesigned", "uk": "замовити редизайн сайту", "df": "pay someone to design the website again", "ex": "We’re having our website redesigned."}, {"id": "4.2|am / is / are + past participle", "l": "4.2", "g": "Grammar: the passive", "en": "am / is / are + past participle", "uk": "Present Simple Passive: am / is / are + 3-тя форма", "df": "the passive in the present: the action is done to the subject", "ex": "The office is cleaned every evening."}, {"id": "4.2|am / is / are + V3", "l": "4.2", "g": "Grammar: the passive", "en": "am / is / are + V3", "uk": "Present Simple Passive: am / is / are + V3", "df": "V3 = past participle (3rd form of the verb)", "ex": "Our code is reviewed by two developers."}, {"id": "4.2|was / were + past participle", "l": "4.2", "g": "Grammar: the passive", "en": "was / were + past participle", "uk": "Past Simple Passive: was / were + 3-тя форма", "df": "the passive in the past", "ex": "The app was launched in 2024."}, {"id": "4.2|was / were + V3", "l": "4.2", "g": "Grammar: the passive", "en": "was / were + V3", "uk": "Past Simple Passive: was / were + V3", "df": "V3 = past participle (3rd form of the verb)", "ex": "The meetings were moved online."}, {"id": "4.2|by + agent", "l": "4.2", "g": "Grammar: the passive", "en": "by + agent", "uk": "by + виконавець дії", "df": "says who did the action in a passive sentence", "ex": "The new policy was announced by the CEO."}, {"id": "4.2|have + something + V3", "l": "4.2", "g": "Grammar: the passive", "en": "have + something + V3", "uk": "have something done – щось зробили для тебе", "df": "someone else does a job for you (often a service you pay for)", "ex": "We had our office redesigned last year."}, {"id": "4.2|get + something + V3", "l": "4.2", "g": "Grammar: the passive", "en": "get + something + V3", "uk": "get something done – (розмовне) щось зробили для тебе", "df": "the same as have something done, more informal", "ex": "I need to get my laptop fixed."}, {"id": "4.2|have my laptop repaired", "l": "4.2", "g": "Grammar: the passive", "en": "have my laptop repaired", "uk": "віддати ноутбук у ремонт (його відремонтують)", "df": "pay someone to repair your laptop", "ex": "I had my laptop repaired at the service centre."}, {"id": "4.2|have our website redesigned", "l": "4.2", "g": "Grammar: the passive", "en": "have our website redesigned", "uk": "замовити редизайн нашого сайту", "df": "pay a designer to make the website new", "ex": "We’re having our website redesigned this spring."}, {"id": "4.3|Can we move to …?", "l": "4.3", "g": "Changing the subject", "en": "Can we move to …?", "uk": "Чи можемо ми перейти до …?", "df": "a polite way to start a new topic", "ex": "Can we move to item 3 on the agenda?"}, {"id": "4.3|Is this a good moment to start talking about …?", "l": "4.3", "g": "Changing the subject", "en": "Is this a good moment to start talking about …?", "uk": "Чи зараз слушний момент поговорити про …?", "df": "a very polite way to change the topic", "ex": "Is this a good moment to start talking about the budget?"}, {"id": "4.3|I really think we should get to …", "l": "4.3", "g": "Changing the subject", "en": "I really think we should get to …", "uk": "Думаю, нам варто перейти до …", "df": "a stronger way to bring your topic", "ex": "I really think we should get to the Diabsensor now."}, {"id": "4.3|That reminds me.", "l": "4.3", "g": "Changing the subject", "en": "That reminds me.", "uk": "До речі, це мені нагадало…", "df": "you suddenly remember something connected", "ex": "That reminds me, I need to call the client."}, {"id": "4.3|Before I forget, …", "l": "4.3", "g": "Changing the subject", "en": "Before I forget, …", "uk": "Поки не забула, …", "df": "you want to say something important now", "ex": "Before I forget, the meeting is moved to Friday."}, {"id": "4.3|We’ll come to that later.", "l": "4.3", "g": "Staying on track", "en": "We’ll come to that later.", "uk": "Ми до цього ще повернемося.", "df": "politely postpone a topic", "ex": "Relax. We’ll come to that later."}, {"id": "4.3|We’ll get to … in a moment.", "l": "4.3", "g": "Staying on track", "en": "We’ll get to … in a moment.", "uk": "Ми перейдемо до … за хвилинку.", "df": "promise to talk about it soon", "ex": "We’ll get to the price in a moment."}, {"id": "4.3|There will be plenty of time for that later.", "l": "4.3", "g": "Staying on track", "en": "There will be plenty of time for that later.", "uk": "На це буде достатньо часу пізніше.", "df": "say it’s not the time for this topic now", "ex": "There will be plenty of time for that later."}, {"id": "4.3|stay on track", "l": "4.3", "g": "From the video", "en": "stay on track", "uk": "триматися теми", "df": "keep talking about the main topic", "ex": "It’s difficult to stay on track with Mateo."}, {"id": "4.3|change the subject", "l": "4.3", "g": "From the video", "en": "change the subject", "uk": "змінити тему", "df": "start talking about something different", "ex": "She tried to change the subject several times."}, {"id": "4.3|go with the flow", "l": "4.3", "g": "From the video", "en": "go with the flow", "uk": "пливти за течією", "df": "be relaxed and do what is easiest", "ex": "Alex told her to go with the flow."}, {"id": "4.3|like the sound of your own voice", "l": "4.3", "g": "From the video", "en": "like the sound of your own voice", "uk": "любити себе послухати", "df": "talk a lot and be very confident", "ex": "Mateo likes the sound of his own voice."}, {"id": "4.3|domineering", "l": "4.3", "g": "From the video", "en": "domineering", "uk": "владний, домінантний", "df": "trying to control other people", "ex": "He can be domineering at times."}, {"id": "4.3|multitask", "l": "4.3", "g": "From the video", "en": "multitask", "uk": "робити кілька справ одночасно", "df": "do different tasks at the same time", "ex": "He multitasks: he takes calls during meetings."}, {"id": "4.3|push your agenda", "l": "4.3", "g": "From the video", "en": "push your agenda", "uk": "просувати свій порядок денний", "df": "try hard to talk about what you want", "ex": "If she pushes her agenda, she might save time."}, {"id": "4.3|business relationship", "l": "4.3", "g": "From the video", "en": "business relationship", "uk": "ділові стосунки", "df": "the connection between business partners", "ex": "Going with the flow can build the business relationship."}, {"id": "4.4|build consensus", "l": "4.4", "g": "Building consensus", "en": "build consensus", "uk": "досягати консенсусу", "df": "reach an agreement that the whole group accepts", "ex": "Building consensus is about group needs."}, {"id": "4.4|majority", "l": "4.4", "g": "Building consensus", "en": "majority", "uk": "більшість", "df": "most of the people in a group", "ex": "Is a majority enough, or does everyone have to agree?"}, {"id": "4.4|meet halfway", "l": "4.4", "g": "Building consensus", "en": "meet halfway", "uk": "піти на компроміс, зустрітися посередині", "df": "each side gives up something to agree", "ex": "Sometimes we need to meet halfway."}, {"id": "4.4|find the middle ground", "l": "4.4", "g": "Building consensus", "en": "find the middle ground", "uk": "знайти золоту середину", "df": "find a solution between two positions", "ex": "Let’s try to find the middle ground."}, {"id": "4.4|be involved in", "l": "4.4", "g": "Building consensus", "en": "be involved in", "uk": "бути залученим до", "df": "take part in something", "ex": "Everybody must be involved in the conversation."}, {"id": "4.4|of equal weight", "l": "4.4", "g": "Building consensus", "en": "of equal weight", "uk": "однаково важливий", "df": "equally important", "ex": "Everybody’s opinion is of equal weight."}, {"id": "4.4|process", "l": "4.4", "g": "Building consensus", "en": "process", "uk": "процес, спосіб роботи", "df": "the way we do something step by step", "ex": "We need to decide on the process first."}, {"id": "4.4|narrow down the options", "l": "4.4", "g": "Building consensus", "en": "narrow down the options", "uk": "звузити варіанти", "df": "remove some options to get closer to a decision", "ex": "We’re already narrowing down the options."}, {"id": "4.4|dominate", "l": "4.4", "g": "Building consensus", "en": "dominate", "uk": "домінувати", "df": "control a conversation or a group", "ex": "In a big group one or two people always dominate."}, {"id": "4.4|reach agreement", "l": "4.4", "g": "Building consensus", "en": "reach agreement", "uk": "дійти згоди", "df": "finally agree after a discussion", "ex": "It took an hour to reach agreement on the budget."}, {"id": "4.4|be involved", "l": "4.4", "g": "Building consensus", "en": "be involved", "uk": "бути залученим", "df": "take part and have a say", "ex": "I want the whole team to be involved."}, {"id": "4.4|talking stick", "l": "4.4", "g": "Building consensus", "en": "talking stick", "uk": "«паличка слова» (говорить той, у кого вона)", "df": "an object: only the person holding it can speak", "ex": "We use a virtual talking stick so nobody dominates the call."}, {"id": "4.4|I agree with …", "l": "4.4", "g": "Agreeing and disagreeing", "en": "I agree with …", "uk": "Я згодна з …", "df": "say you have the same opinion as someone", "ex": "I agree with Tanya."}, {"id": "4.4|Yes, I think you’re right.", "l": "4.4", "g": "Agreeing and disagreeing", "en": "Yes, I think you’re right.", "uk": "Так, думаю, ти маєш рацію.", "df": "agree politely", "ex": "Yes, I think you’re right. Let’s do it."}, {"id": "4.4|I’m afraid I disagree.", "l": "4.4", "g": "Agreeing and disagreeing", "en": "I’m afraid I disagree.", "uk": "Боюся, я не погоджуюсь.", "df": "disagree politely", "ex": "I’m afraid I disagree. Small groups are better."}, {"id": "4.4|I’m not sure I agree with you on that.", "l": "4.4", "g": "Agreeing and disagreeing", "en": "I’m not sure I agree with you on that.", "uk": "Не впевнена, що згодна з тобою в цьому.", "df": "a soft way to disagree", "ex": "I’m not sure I agree with you on that."}, {"id": "4.4|Yes, I agree, too.", "l": "4.4", "g": "Agreeing and disagreeing", "en": "Yes, I agree, too.", "uk": "Так, я теж згодна.", "df": "agree with what someone has just said", "ex": "— Small groups work better. — Yes, I agree, too."}, {"id": "4.4|I agree that …", "l": "4.4", "g": "Agreeing and disagreeing", "en": "I agree that …", "uk": "Я згодна, що …", "df": "agree with an idea", "ex": "I agree that we need more time for testing."}, {"id": "4.4|Sorry, I don’t agree with you.", "l": "4.4", "g": "Agreeing and disagreeing", "en": "Sorry, I don’t agree with you.", "uk": "Вибач, я з тобою не згодна.", "df": "disagree directly but politely", "ex": "Sorry, I don’t agree with you. The deadline is too short."}, {"id": "4.4|I think we should …", "l": "4.4", "g": "Suggesting and reacting", "en": "I think we should …", "uk": "Думаю, нам варто …", "df": "make a suggestion", "ex": "I think we should stay as one big group."}, {"id": "4.4|Why don’t we …?", "l": "4.4", "g": "Suggesting and reacting", "en": "Why don’t we …?", "uk": "Чому б нам не …?", "df": "make a suggestion", "ex": "Why don’t we work in pairs?"}, {"id": "4.4|How about if we …?", "l": "4.4", "g": "Suggesting and reacting", "en": "How about if we …?", "uk": "А що, якщо ми …?", "df": "make a suggestion", "ex": "How about if we break into small groups?"}, {"id": "4.4|That’s not a bad idea.", "l": "4.4", "g": "Suggesting and reacting", "en": "That’s not a bad idea.", "uk": "Це непогана ідея.", "df": "react positively, but carefully", "ex": "Actually, that’s not a bad idea."}, {"id": "4.4|Good idea!", "l": "4.4", "g": "Suggesting and reacting", "en": "Good idea!", "uk": "Гарна ідея!", "df": "react positively to a suggestion", "ex": "— Why don’t we record the meeting? — Good idea!"}, {"id": "4.4|So we need to …", "l": "4.4", "g": "Suggesting and reacting", "en": "So we need to …", "uk": "Отже, нам потрібно …", "df": "sum up what the group must do", "ex": "So we need to choose one option by Friday."}, {"id": "4.4|I don’t think …", "l": "4.4", "g": "Suggesting and reacting", "en": "I don’t think …", "uk": "Я не думаю, що …", "df": "disagree or doubt softly", "ex": "I don’t think that’s the best solution."}, {"id": "4.5|confirm an order", "l": "4.5", "g": "Order confirmation", "en": "confirm an order", "uk": "підтвердити замовлення", "df": "say in writing that an order is accepted", "ex": "We are writing to confirm your order."}, {"id": "4.5|unit price", "l": "4.5", "g": "Order confirmation", "en": "unit price", "uk": "ціна за одиницю", "df": "the price of one item", "ex": "The unit price is €230."}, {"id": "4.5|payment terms", "l": "4.5", "g": "Order confirmation", "en": "payment terms", "uk": "умови оплати", "df": "when a
